version: "1"
calls:
  - call_id: "openai:gpt-4o-mini.chat"
    provider: "openai"
    model_id: "gpt-4o-mini"
    kind: "chat"
    modality: "multimodal"
    caps: ["json_mode","tools","images_in"]
    limits: { max_input_tokens: 128000, max_output_tokens: 16384 }
    price: { input_per_1k: 0.00015, output_per_1k: 0.00060 }
    adapter: "openai"
    payload_style: "chat_completions_v1"
    aliases: ["openai:multimodal-cheap"]

  - call_id: "openai:text-embedding-3-large.embed"
    provider: "openai"
    model_id: "text-embedding-3-large"
    kind: "embed"
    modality: "embed"
    caps: []
    limits: { max_input_tokens: 8192, max_output_tokens: 0 }
    price: { input_per_1k: 0.00002, output_per_1k: 0.0 }
    adapter: "openai"
    payload_style: "embeddings_v1"

  - call_id: "local:echo.chat"
    provider: "local"
    model_id: "echo"
    kind: "chat"
    modality: "text"
    caps: ["json_mode"]
    limits: { max_input_tokens: 8192, max_output_tokens: 1024 }
    price: { input_per_1k: 0.0, output_per_1k: 0.0 }
    adapter: "local"
    payload_style: "echo"

  - call_id: "openai:gpt-image-1-5.image_generation"
    provider: "openai"
    model_id: "gpt-image-1.5"
    kind: "image_generation"
    modality: "image_output"
    caps: ["images_out"]
    limits: { max_input_tokens: 0, max_output_tokens: 0 }
    price: { input_per_1k: 0.0, output_per_1k: 0.0 }
    image_limits:
      supported_sizes: ["1024x1024", "1024x1536", "1536x1024", "auto"]
      supported_aspect_ratios: []
      max_n: 1
      seed_supported: false
      quality_supported: true
      supported_qualities: ["low", "medium", "high", "auto"]
    image_price: { known: false }
    adapter: "openai_image"
    payload_style: "openai_images_v1"

  - call_id: "google:gemini-3-1-flash-image.image_generation"
    provider: "google"
    model_id: "gemini-3.1-flash-image"
    kind: "image_generation"
    modality: "image_output"
    caps: ["images_out"]
    limits: { max_input_tokens: 0, max_output_tokens: 0 }
    price: { input_per_1k: 0.0, output_per_1k: 0.0 }
    image_limits:
      supported_sizes: ["0.5K", "1K", "2K", "4K"]
      supported_aspect_ratios: ["1:1", "1:4", "1:8", "2:3", "3:2", "3:4", "4:1", "4:3", "4:5", "5:4", "8:1", "9:16", "16:9", "21:9"]
      max_n: 1
      seed_supported: false
      quality_supported: false
    image_price:
      known: true
      per_image_by_size: { "0.5K": 0.045, "1K": 0.067, "2K": 0.101, "4K": 0.151 }
      prompt_input_per_1m: 0.50
    adapter: "google_image"
    payload_style: "gemini_generate_content_image_v1beta"

  - call_id: "bytedance:doubao-seedream-4-0-250828.image_generation"
    provider: "bytedance"
    model_id: "doubao-seedream-4-0-250828"
    kind: "image_generation"
    modality: "image_output"
    caps: ["images_out"]
    limits: { max_input_tokens: 0, max_output_tokens: 0 }
    price: { input_per_1k: 0.0, output_per_1k: 0.0 }
    image_limits:
      supported_sizes: ["2K"]
      supported_aspect_ratios: []
      max_n: 1
      seed_supported: false
      quality_supported: false
    image_price: { known: false }
    adapter: "seedream_image"
    payload_style: "volcengine_ark_images_v3"

  - call_id: "openai:gpt-image-2-2026-04-21.image_generation"
    provider: "openai"
    model_id: "gpt-image-2-2026-04-21"
    kind: "image_generation"
    modality: "image_output"
    caps: ["images_out"]
    limits: { max_input_tokens: 0, max_output_tokens: 0 }
    price: { input_per_1k: 0.0, output_per_1k: 0.0 }
    image_limits:
      supported_sizes: ["1024x1024", "1024x1536", "1536x1024", "auto"]
      supported_aspect_ratios: []
      max_n: 1
      seed_supported: false
      quality_supported: true
      supported_qualities: ["low", "medium", "high", "auto"]
    # Token rates are known, but the official docs do not expose a stable
    # preflight output-token maximum for 1536x1024 medium. Fail closed.
    image_price:
      known: false
      prompt_input_per_1m: 5.0
      image_output_per_1m: 30.0
    adapter: "openai_image"
    payload_style: "openai_images_v1"

  - call_id: "google:gemini-3-pro-image-preview.image_generation"
    provider: "google"
    model_id: "gemini-3-pro-image-preview"
    kind: "image_generation"
    modality: "image_output"
    caps: ["images_out"]
    limits: { max_input_tokens: 0, max_output_tokens: 0 }
    price: { input_per_1k: 0.0, output_per_1k: 0.0 }
    image_limits:
      supported_sizes: ["1K", "2K", "4K"]
      supported_aspect_ratios: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"]
      max_n: 1
      seed_supported: false
      quality_supported: false
    image_price:
      known: true
      per_image_by_size: { "1K": 0.134, "2K": 0.134, "4K": 0.24 }
      prompt_input_per_1m: 2.0
    adapter: "google_image"
    payload_style: "gemini_generate_content_image_v1beta"

  - call_id: "seedream:dola-seedream-5-0-pro-260628.image_generation"
    provider: "seedream"
    model_id: "dola-seedream-5-0-pro-260628"
    kind: "image_generation"
    modality: "image_output"
    caps: ["images_out"]
    limits: { max_input_tokens: 0, max_output_tokens: 0 }
    price: { input_per_1k: 0.0, output_per_1k: 0.0 }
    image_limits:
      supported_sizes: ["1K", "2K"]
      supported_aspect_ratios: ["1:1", "4:3", "3:4", "16:9", "9:16", "3:2", "2:3", "21:9"]
      max_n: 1
      seed_supported: false
      quality_supported: false
    image_price:
      known: true
      per_image_by_size: { "1K": 0.045, "2K": 0.09 }
    adapter: "seedream_image"
    payload_style: "byteplus_modelark_images_v3"
