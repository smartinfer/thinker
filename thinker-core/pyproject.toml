[project]
name = "thinker-core"
version = "0.1.0"
description = "Thinker core library (registry-driven LLM access + ThinkerQL)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{name="Anjan Goswami", email="anjan@thinker.dev"}]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "rich>=13.7",
  "tiktoken>=0.7; platform_system != 'Windows'",
  "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2","respx>=0.21","mypy>=1.11","ruff>=0.6","black>=24.8"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["thinker/tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
